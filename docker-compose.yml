version: '3.8'

services:
  gvox-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gvox-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Montar data.json para persistencia (opcional)
      - ./data.json:/app/data.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
